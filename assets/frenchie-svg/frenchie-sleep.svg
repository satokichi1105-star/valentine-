<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
  width="200" height="200" class="frenchie frx-sleep" role="img"
  aria-label="French Bulldog">
  <style>
  svg.frenchie {
    --frx-ink: #1b1b24;
    --frx-dark: #3c3c4a;
    --frx-dark2: #5d5d70;
    --frx-fur: #fbfbfd;
    --frx-shade: #dcdce6;
  }
  .frenchie .frx-line {
    stroke: var(--frx-ink); stroke-width: 4; stroke-linejoin: round;
  }
  .frenchie .frx-dog, .frenchie .frx-pose, .frenchie .frx-tail,
  .frenchie .frx-leg, .frenchie .frx-head, .frenchie .frx-body,
  .frenchie .frx-breath { transform-box: view-box; }
  .frenchie .frx-dot, .frenchie .frx-spark, .frenchie .frx-zzz,
  .frenchie .frx-eye { transform-box: fill-box; transform-origin: center; }
  .frenchie .frx-ear { transform-box: fill-box; transform-origin: 50% 100%; }
  .frenchie .frx-dog { transform-origin: 100px 184px; }
  .frenchie .frx-tail { transform-origin: 141px 141px; }
  .frenchie .frx-head { transform-origin: 100px 128px; }
  .frenchie .frx-body { transform-origin: 100px 178px; }
  .frenchie .frx-leg-l { transform-origin: 78px 150px; }
  .frenchie .frx-leg-r { transform-origin: 122px 150px; }
  .frenchie .frx-breath { transform-origin: 100px 178px; }
  .frenchie .frx-curl, .frenchie .frx-eye-happy,
  .frenchie .frx-tongue, .frenchie .frx-fx { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .frenchie * { animation: none !important; }
  }
  .frx-sleep .frx-stand { display: none; }
  .frx-sleep .frx-curl, .frx-sleep .frx-fx-zzz { display: block; }
  .frx-sleep .frx-breath { animation: frx-sleep-breath 3.4s ease-in-out infinite; }
  .frx-sleep .frx-zzz { animation: frx-sleep-zzz 3.4s ease-in-out infinite; opacity: 0; }
  .frx-sleep .frx-zzz-1 { animation-delay: 1.1s; }
  .frx-sleep .frx-zzz-2 { animation-delay: 2.2s; }
  @keyframes frx-sleep-breath {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.012, 1.035); }
  }
  @keyframes frx-sleep-zzz {
    0%   { opacity: 0; transform: translate(0, 10px) scale(.8); }
    25%  { opacity: 1; }
    70%  { opacity: .9; }
    100% { opacity: 0; transform: translate(10px, -18px) scale(1.1); }
  }
  </style>
  <defs>
    <clipPath id="frx-sleep-head"><path d="M100 30 C136 30 158 52 158 80 C158 104 145 121 126 129 C117 132 108 134 100 134 C92 134 83 132 74 129 C55 121 42 104 42 80 C42 52 64 30 100 30 Z"/></clipPath>
    <clipPath id="frx-sleep-body"><ellipse cx="100" cy="138" rx="45" ry="40"/></clipPath>
    <clipPath id="frx-sleep-curlbody"><path d="M62 176 C40 176 26 162 30 146 C34 128 52 118 78 116 C104 114 136 116 156 126 C176 136 180 156 168 168 C158 178 138 180 118 178 Z"/></clipPath>
    <clipPath id="frx-sleep-curlhead"><path d="M56 100 C80 100 96 116 96 136 C96 156 80 170 56 170 C32 170 18 156 18 136 C18 116 32 100 56 100 Z"/></clipPath>
  </defs>
  <g class="frx-dog">
    <g class="frx-pose frx-stand">
      <g class="frx-tail">
        <path class="frx-line" fill="var(--frx-dark)"
          d="M139 124 C151 117 163 123 162 134 C161 145 150 148 140 143 Z"/>
      </g>
      <g transform="translate(66,58) rotate(-17) scale(.9)">
        <g class="frx-ear frx-ear-l">
          <path class="frx-line" fill="var(--frx-dark)" d="M-20 6 C-27 -18 -21 -50 -5 -59 C2 -62 9 -58 13 -49 C21 -32 23 -12 19 6 Z"/>
          <path fill="var(--frx-dark2)" d="M-20 6 C-27 -18 -21 -50 -5 -59 C2 -62 9 -58 13 -49 C21 -32 23 -12 19 6 Z" transform="translate(0,-14) scale(.54)"/>
        </g>
      </g>
      <g transform="translate(134,58) scale(-1,1) rotate(-17) scale(.9)">
        <g class="frx-ear frx-ear-r">
          <path class="frx-line" fill="var(--frx-dark)" d="M-20 6 C-27 -18 -21 -50 -5 -59 C2 -62 9 -58 13 -49 C21 -32 23 -12 19 6 Z"/>
          <path fill="var(--frx-dark2)" d="M-20 6 C-27 -18 -21 -50 -5 -59 C2 -62 9 -58 13 -49 C21 -32 23 -12 19 6 Z" transform="translate(0,-14) scale(.54)"/>
        </g>
      </g>
      <g class="frx-body">
        <ellipse class="frx-line" cx="100" cy="138" rx="45" ry="40" fill="var(--frx-fur)"/>
        <g clip-path="url(#frx-sleep-body)">
          <path fill="var(--frx-dark)" d="M152 104 C163 130 158 162 138 178 C119 190 102 182 98 168 C93 150 105 128 120 112 C131 101 144 96 152 104 Z"/>
        </g>
      </g>
      <g class="frx-leg frx-leg-l">
        <ellipse class="frx-line" cx="78" cy="170" rx="18" ry="13" fill="var(--frx-fur)"/>
        <path fill="none" stroke="var(--frx-shade)" stroke-width="3" stroke-linecap="round"
          d="M73 167 V177 M83 167 V177"/>
      </g>
      <g class="frx-leg frx-leg-r">
        <ellipse class="frx-line" cx="122" cy="170" rx="18" ry="13" fill="var(--frx-fur)"/>
        <path fill="none" stroke="var(--frx-shade)" stroke-width="3" stroke-linecap="round"
          d="M117 167 V177 M127 167 V177"/>
      </g>
      <g class="frx-head">
        <path class="frx-line" fill="var(--frx-fur)" d="M100 30 C136 30 158 52 158 80 C158 104 145 121 126 129 C117 132 108 134 100 134 C92 134 83 132 74 129 C55 121 42 104 42 80 C42 52 64 30 100 30 Z"/>
        <g clip-path="url(#frx-sleep-head)">
          <path fill="var(--frx-dark)" d="M30 8 H170 V92 C156 108 142 96 132 104 C122 112 112 104 100 106 C88 108 78 112 68 104 C58 96 44 108 30 92 Z"/>
          <path fill="var(--frx-fur)" d="M99 28 C110 31 113 46 109 60 C106 72 105 86 107 104 L91 104 C89 86 91 72 89 60 C87 46 89 31 99 28 Z"/>
          <ellipse cx="100" cy="103" rx="35" ry="25" fill="var(--frx-shade)"/>
          <ellipse cx="100" cy="107" rx="34" ry="24" fill="var(--frx-fur)"/>
        </g>
        <g class="frx-eye">
          <circle cx="70" cy="76" r="14" fill="var(--frx-dark2)"/>
          <circle cx="70" cy="76" r="11" fill="var(--frx-ink)"/>
          <circle cx="66" cy="72" r="3.6" fill="#fff"/>
          <circle cx="73" cy="81" r="1.8" fill="#fff" opacity=".7"/>
        </g>
        <path class="frx-eye-happy" fill="none" stroke="var(--frx-dark2)"
          stroke-width="6" stroke-linecap="round" d="M58 80 Q70 65 82 80"/>
        <g class="frx-eye">
          <circle cx="130" cy="76" r="14" fill="var(--frx-dark2)"/>
          <circle cx="130" cy="76" r="11" fill="var(--frx-ink)"/>
          <circle cx="126" cy="72" r="3.6" fill="#fff"/>
          <circle cx="133" cy="81" r="1.8" fill="#fff" opacity=".7"/>
        </g>
        <path class="frx-eye-happy" fill="none" stroke="var(--frx-dark2)"
          stroke-width="6" stroke-linecap="round" d="M118 80 Q130 65 142 80"/>
        <path fill="var(--frx-ink)" d="M100 88 C110 88 116 94 116 100 C116 107 109 113 100 113 C91 113 84 107 84 100 C84 94 90 88 100 88 Z"/>
        <ellipse cx="93" cy="99" rx="3.4" ry="4.2" fill="var(--frx-dark2)" opacity=".5"/>
        <ellipse cx="107" cy="99" rx="3.4" ry="4.2" fill="var(--frx-dark2)" opacity=".5"/>
        <path fill="none" stroke="var(--frx-ink)" stroke-width="3.4" stroke-linecap="round"
          d="M100 113 V124 M100 124 C95 132 84 132 80 124 M100 124 C105 132 116 132 120 124"/>
        <path class="frx-tongue" fill="var(--frx-shade)" stroke="var(--frx-ink)"
          stroke-width="3" stroke-linejoin="round"
          d="M91 126 H109 C109 137 102 143 100 143 C98 143 91 137 91 126 Z"/>
      </g>
    </g>
    <g class="frx-pose frx-curl">
      <g class="frx-breath">
        <path class="frx-line" fill="var(--frx-dark)"
          d="M168 142 C182 138 190 148 186 158 C182 167 170 168 164 161 Z"/>
        <g transform="translate(36,116) rotate(-24)">
          <path class="frx-line" fill="var(--frx-dark)" d="M-20 6 C-27 -18 -21 -50 -5 -59 C2 -62 9 -58 13 -49 C21 -32 23 -12 19 6 Z" transform="scale(.62)"/>
          <path fill="var(--frx-dark2)" d="M-20 6 C-27 -18 -21 -50 -5 -59 C2 -62 9 -58 13 -49 C21 -32 23 -12 19 6 Z" transform="translate(0,-10) scale(.34)"/>
        </g>
        <g transform="translate(78,108) rotate(12)">
          <path class="frx-line" fill="var(--frx-dark)" d="M-20 6 C-27 -18 -21 -50 -5 -59 C2 -62 9 -58 13 -49 C21 -32 23 -12 19 6 Z" transform="scale(.62)"/>
          <path fill="var(--frx-dark2)" d="M-20 6 C-27 -18 -21 -50 -5 -59 C2 -62 9 -58 13 -49 C21 -32 23 -12 19 6 Z" transform="translate(0,-10) scale(.34)"/>
        </g>
        <path class="frx-line" fill="var(--frx-fur)" d="M62 176 C40 176 26 162 30 146 C34 128 52 118 78 116 C104 114 136 116 156 126 C176 136 180 156 168 168 C158 178 138 180 118 178 Z"/>
        <g clip-path="url(#frx-sleep-curlbody)">
          <path fill="var(--frx-dark)"
            d="M92 110 C130 108 164 120 178 136 C186 148 180 162 168 168 L92 170 Z"/>
        </g>
        <path class="frx-line" fill="var(--frx-fur)" d="M56 100 C80 100 96 116 96 136 C96 156 80 170 56 170 C32 170 18 156 18 136 C18 116 32 100 56 100 Z"/>
        <g clip-path="url(#frx-sleep-curlhead)">
          <path fill="var(--frx-dark)" d="M6 90 H102 V144 C88 154 72 142 56 146 C40 150 20 144 6 136 Z"/>
          <path fill="var(--frx-fur)"
            d="M52 96 C60 98 62 112 58 122 L46 120 C44 110 44 96 52 96 Z"/>
          <ellipse cx="42" cy="152" rx="29" ry="17" fill="var(--frx-shade)"/>
          <ellipse cx="42" cy="155" rx="29" ry="17" fill="var(--frx-fur)"/>
        </g>
        <path fill="none" stroke="var(--frx-dark2)" stroke-width="5" stroke-linecap="round"
          d="M32 134 Q41 143 50 134 M68 130 Q77 139 86 130"/>
        <ellipse cx="20" cy="150" rx="10" ry="8" fill="var(--frx-ink)"/>
        <ellipse class="frx-line" cx="84" cy="174" rx="17" ry="10" fill="var(--frx-fur)"/>
        <path fill="none" stroke="var(--frx-shade)" stroke-width="3" stroke-linecap="round"
          d="M84 170 V181"/>
      </g>
    </g>
  </g>
    <g class="frx-fx frx-fx-dots">
      <circle class="frx-dot frx-dot-0" cx="150" cy="56" r="5" fill="var(--frx-fur)" stroke="var(--frx-ink)" stroke-width="3"/>
      <circle class="frx-dot frx-dot-1" cx="168" cy="38" r="7" fill="var(--frx-fur)" stroke="var(--frx-ink)" stroke-width="3"/>
      <circle class="frx-dot frx-dot-2" cx="187" cy="17" r="9" fill="var(--frx-fur)" stroke="var(--frx-ink)" stroke-width="3"/>
    </g>
    <g class="frx-fx frx-fx-sparks">
      <g transform="translate(26,60) scale(1.0)"><path class="frx-spark frx-spark-0" fill="var(--frx-fur)" d="M0 -13 Q2 -2 13 0 Q2 2 0 13 Q-2 2 -13 0 Q-2 -2 0 -13 Z"/></g>
      <g transform="translate(176,44) scale(1.25)"><path class="frx-spark frx-spark-1" fill="var(--frx-fur)" d="M0 -13 Q2 -2 13 0 Q2 2 0 13 Q-2 2 -13 0 Q-2 -2 0 -13 Z"/></g>
      <g transform="translate(170,132) scale(0.85)"><path class="frx-spark frx-spark-2" fill="var(--frx-fur)" d="M0 -13 Q2 -2 13 0 Q2 2 0 13 Q-2 2 -13 0 Q-2 -2 0 -13 Z"/></g>
    </g>
    <g class="frx-fx frx-fx-zzz">
      <g transform="translate(112,76) scale(0.55)"><path class="frx-zzz frx-zzz-0" fill="var(--frx-fur)" stroke="var(--frx-ink)" stroke-width="4" stroke-linejoin="round" d="M0 0 H22 V7 L10 19 H22 V26 H0 V19 L12 7 H0 Z"/></g>
      <g transform="translate(136,48) scale(0.8)"><path class="frx-zzz frx-zzz-1" fill="var(--frx-fur)" stroke="var(--frx-ink)" stroke-width="4" stroke-linejoin="round" d="M0 0 H22 V7 L10 19 H22 V26 H0 V19 L12 7 H0 Z"/></g>
      <g transform="translate(164,16) scale(1.05)"><path class="frx-zzz frx-zzz-2" fill="var(--frx-fur)" stroke="var(--frx-ink)" stroke-width="4" stroke-linejoin="round" d="M0 0 H22 V7 L10 19 H22 V26 H0 V19 L12 7 H0 Z"/></g>
    </g>
</svg>
