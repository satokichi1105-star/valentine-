<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>French Bulldog Sprite Preview</title>
<style>
    body{margin:0;padding:32px;background:#12131f;color:#fff;
        font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
    h1{font-size:20px;margin:0 0 20px}
    .grid{display:flex;flex-wrap:wrap;gap:18px}
    .card{margin:0;background:#ffffff10;border:1px solid #ffffff22;border-radius:14px;
        padding:14px;text-align:center;width:284px}
    .sprite{width:256px;height:256px;
        background-image:url("frenchie_sheet.png");
        background-size:1024px 1280px;
        image-rendering:pixelated}
    figcaption{margin-top:10px;font-size:12px;line-height:1.6;color:#ffffffcc}
    small{color:#ffffff88}
    .sp-idle{background-position-y:0px;animation:run-idle 1.0s steps(4) infinite}
    @keyframes run-idle{to{background-position-x:-1024px}}
    .sp-walk{background-position-y:-256px;animation:run-walk 0.5s steps(4) infinite}
    @keyframes run-walk{to{background-position-x:-1024px}}
    .sp-work{background-position-y:-512px;animation:run-work 0.8s steps(4) infinite}
    @keyframes run-work{to{background-position-x:-1024px}}
    .sp-done{background-position-y:-768px;animation:run-done 0.5s steps(4) infinite}
    @keyframes run-done{to{background-position-x:-1024px}}
    .sp-sleep{background-position-y:-1024px;animation:run-sleep 1.5s steps(3) infinite}
    @keyframes run-sleep{to{background-position-x:-768px}}
</style>
</head>
<body>
<h1>🐶 French Bulldog — 32x32 sprite sheet</h1>
<div class="grid">
    <figure class="card"><div class="sprite sp-idle"></div><figcaption><b>idle</b><br>待機 (座って尻尾振り)<br><small>4 frames / 4fps</small></figcaption></figure>
    <figure class="card"><div class="sprite sp-walk"></div><figcaption><b>walk</b><br>歩行<br><small>4 frames / 8fps</small></figcaption></figure>
    <figure class="card"><div class="sprite sp-work"></div><figcaption><b>work</b><br>作業中 (首かしげ)<br><small>4 frames / 5fps</small></figcaption></figure>
    <figure class="card"><div class="sprite sp-done"></div><figcaption><b>done</b><br>完了 (ジャンプ)<br><small>4 frames / 8fps</small></figcaption></figure>
    <figure class="card"><div class="sprite sp-sleep"></div><figcaption><b>sleep</b><br>スリープ (丸まる)<br><small>3 frames / 2fps</small></figcaption></figure>
</div>
</body>
</html>
